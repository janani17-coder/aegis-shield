
site_name: Aegis Security Hub
site_description: Cybersecurity Assessment and Evidence Portfolio
site_author: Cybersecurity Learning Project
site_url: https://janani17-coder.github.io/aegis-shield/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

nav:
  - Home: index.md
  - Executive Summary: executive-summary.md
  - Security Findings: findings.md
  - Risk Register: risk-register.md
  - Security Policies: policies.md
  - Detection & Monitoring: detections.md
  - Incident Response: incident-response.md
  - Evidence Index: evidence.md
  - Staff Awareness Guide: awareness-guide.md
  - Awareness Knowledge Check: awareness-quiz.md
  - Go-Live Recommendation: go-live-recommendation.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true



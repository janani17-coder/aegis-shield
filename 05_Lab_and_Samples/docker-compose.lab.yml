
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: aegis-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa
    container_name: aegis-dvwa
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped


services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: aegis-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa
    container_name: aegis-dvwa
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: aegis-zap
    profiles:
      - scan
    depends_on:
      - juice-shop
    command:
      - zap-baseline.py
      - -t
      - http://juice-shop:3000
      - -r
      - task10-zap-report.html
    volumes:
      - ./zap-reports:/zap/wrk:rw